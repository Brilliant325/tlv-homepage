name: Update LMU race calendar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-lmu-calendar.yml'
      - 'index.html'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch LMU Assister schedule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "TLV-Motorsport-Calendar/1.0", "Accept": "application/json"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          bootstrap = get_json("https://lmu-assister.com/bootstrap")
          base = bootstrap.get("api_base_url")
          if not base:
              raise RuntimeError("LMU Assister bootstrap did not provide api_base_url")
          base = base.rstrip("/")
          import re
          base = re.sub(r"/api/v[0-9]+$", "", base)
          schedule = get_json(base + "/api/v3/schedule")
          if not isinstance(schedule, dict) or not isinstance(schedule.get("schedules"), dict):
              raise RuntimeError("Unexpected schedule response from LMU Assister")
          with open("schedule.json", "w", encoding="utf-8") as output:
              json.dump(schedule, output, ensure_ascii=False, separators=(",", ":"))
              output.write("\n")
          print("Fetched schedule from LMU Assister successfully.")
          PY

      - name: Commit updated schedule if changed
        run: |
          if git diff --quiet -- schedule.json; then
            echo "Schedule unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git commit -m "Update LMU race calendar data"
          git push
